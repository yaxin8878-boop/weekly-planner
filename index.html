<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f6">
<title>My Week · 我的计划</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf8f6;color:#2f2a2a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
button,input,textarea{font:inherit}
.app{max-width:680px;margin:auto;padding:18px 14px 38px}
.header{background:rgba(255,255,255,.9);border:1px solid #eee5e1;border-radius:28px;padding:20px;box-shadow:0 8px 30px rgba(75,55,45,.06)}
.eyebrow{font-size:12px;letter-spacing:1.5px;color:#a28f89;text-transform:uppercase}
h1{font-size:28px;margin:5px 0 2px;letter-spacing:-.6px}
.subtitle{font-size:13px;color:#968985}
.nav{display:flex;gap:8px;margin-top:17px}
.btn{border:0;border-radius:14px;padding:10px 12px;background:#f3eeeb;color:#5c504d;font-weight:650}
.primary{background:#d99cae;color:#fff}
.days{margin-top:14px}
.day{background:#fff;border:1px solid #eee5e1;border-radius:23px;padding:15px;margin-top:11px;box-shadow:0 5px 18px rgba(75,55,45,.04)}
.day.today{border-color:#e4b7c3;box-shadow:0 0 0 2px #f2dce2,0 7px 22px rgba(75,55,45,.06)}
.dayhead{display:flex;justify-content:space-between;align-items:center}
.dow{font-size:18px;font-weight:800}
.date{font-size:12px;color:#a09490;margin-top:2px}
.badge{font-size:11px;padding:5px 9px;border-radius:20px;background:#faf0f3;color:#bd7389}
.task{margin-top:10px;border:1px solid #eee7e4;border-radius:16px;padding:11px;background:#fcfbfa}
.taskline{display:flex;align-items:center;gap:8px}
.check{width:19px;height:19px;accent-color:#d99cae}
.title{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:#332d2c;min-width:0}
.task.done .title{text-decoration:line-through;color:#aaa}
.x{border:0;background:transparent;color:#b5aaa6;font-size:20px;padding:0 2px}
.time{width:100%;margin-top:8px;border:1px solid #eee5e1;border-radius:11px;padding:8px;background:#fff;color:#6e625f}
.note{width:100%;margin-top:8px;border:1px solid #eee5e1;border-radius:11px;padding:8px;background:#fff;min-height:40px;resize:vertical;font-size:13px;outline:none}
.add{width:100%;margin-top:10px}
.empty{text-align:center;color:#b5aaa6;font-size:13px;padding:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(43,34,30,.35);z-index:10;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:680px;margin:auto;border-radius:28px 28px 0 0;padding:20px 18px 28px}
.sheet h2{margin:0 0 15px;font-size:21px}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:#938682;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid #e8dfdc;border-radius:13px;padding:11px;outline:none}
.sheetbuttons{display:flex;gap:8px;margin-top:14px}.sheetbuttons button{flex:1}
.footer{text-align:center;color:#b2a6a1;font-size:11px;margin-top:18px}
@media(max-width:430px){.app{padding:13px 11px 28px}.header{padding:17px;border-radius:24px}h1{font-size:25px}.day{border-radius:20px}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="eyebrow">MY WEEK · WEEKLY PLANNER</div>
    <h1>我的一周计划 ✿</h1>
    <div id="range" class="subtitle"></div>
    <div class="nav">
      <button class="btn" onclick="moveWeek(-1)">‹ 上周</button>
      <button class="btn primary" onclick="thisWeek()">今天</button>
      <button class="btn" onclick="moveWeek(1)">下周 ›</button>
    </div>
  </header>
  <main id="days" class="days"></main>
  <div class="footer">你的计划会自动保存在这台设备上 ♡</div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
 <div class="sheet">
  <h2>添加一件事 ✿</h2>
  <div class="field"><label>事情</label><input id="newTitle" placeholder="例如：上课、学习、买菜"></div>
  <div class="field"><label>时间</label><input id="newTime" type="time"></div>
  <div class="field"><label>备注</label><textarea id="newNote" placeholder="地点、需要准备什么……"></textarea></div>
  <div class="sheetbuttons"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveNew()">保存</button></div>
 </div>
</div>

<script>
let monday=getMonday(new Date());
let plans=JSON.parse(localStorage.getItem("pretty_weekly_planner")||"{}");
let addKey=null;
const names=["周一","周二","周三","周四","周五","周六","周日"];
function getMonday(d){let x=new Date(d);x.setHours(0,0,0,0);let n=x.getDay()||7;x.setDate(x.getDate()-n+1);return x}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function persist(){localStorage.setItem("pretty_weekly_planner",JSON.stringify(plans))}
function render(){
 let end=new Date(monday);end.setDate(end.getDate()+6);
 document.getElementById("range").textContent=fmt(monday)+" — "+fmt(end);
 let today=key(new Date()), html="";
 for(let i=0;i<7;i++){
  let d=new Date(monday);d.setDate(d.getDate()+i);let k=key(d);if(!plans[k])plans[k]=[];
  let isToday=k===today;
  html+=`<section class="day ${isToday?"today":""}">
   <div class="dayhead"><div><div class="dow">${names[i]}</div><div class="date">${fmt(d)}</div></div>${isToday?'<span class="badge">TODAY</span>':''}</div>`;
  if(!plans[k].length) html+=`<div class="empty">今天还没有安排 ♡</div>`;
  plans[k].forEach((t,j)=>{
   html+=`<div class="task ${t.done?"done":""}">
    <div class="taskline"><input class="check" type="checkbox" ${t.done?"checked":""} onchange="toggle('${k}',${j},this.checked)">
    <input class="title" value="${esc(t.title)}" placeholder="要做什么？" oninput="change('${k}',${j},'title',this.value)">
    <button class="x" onclick="removeTask('${k}',${j})">×</button></div>
    <input class="time" type="time" value="${esc(t.time)}" onchange="change('${k}',${j},'time',this.value)">
    <textarea class="note" placeholder="备注 / 地点 / 其他……" oninput="change('${k}',${j},'note',this.value)">${esc(t.note)}</textarea>
   </div>`;
  });
  html+=`<button class="btn add" onclick="openModal('${k}')">＋ 添加事情</button></section>`;
 }
 document.getElementById("days").innerHTML=html;persist();
}
function openModal(k){addKey=k;newTitle.value="";newTime.value="";newNote.value="";modal.classList.add("show");setTimeout(()=>newTitle.focus(),100)}
function closeModal(){modal.classList.remove("show")}
function saveNew(){let title=newTitle.value.trim(),time=newTime.value,note=newNote.value.trim();if(!title&&!time&&!note)return;plans[addKey].push({title,time,note,done:false});persist();closeModal();render()}
function change(k,j,f,v){plans[k][j][f]=v;persist()}
function toggle(k,j,v){plans[k][j].done=v;persist();render()}
function removeTask(k,j){plans[k].splice(j,1);persist();render()}
function moveWeek(n){monday.setDate(monday.getDate()+n*7);render();scrollTo({top:0,behavior:"smooth"})}
function thisWeek(){monday=getMonday(new Date());render();scrollTo({top:0,behavior:"smooth"})}
render();
</script>
</body>
</html>
