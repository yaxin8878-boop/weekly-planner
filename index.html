<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>不能当鸽子 · Weekly Planner</title>
<style>
:root{
  --bg:#f8f4f1; --card:#fffdfb; --ink:#332d2b; --muted:#958984;
  --pink:#dca5b7; --pink2:#f4dfe5; --line:#eee4df; --green:#9bb7a2;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif}
button,input,textarea{font:inherit} button{border:0}
.app{max-width:680px;margin:auto;padding:22px 18px 50px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700}
.today{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12px}
.hero{background:linear-gradient(135deg,#fffdfb,#f8e9ed);border-radius:30px;padding:25px 22px;
box-shadow:0 10px 30px rgba(70,45,40,.06);position:relative;overflow:hidden}
.hero h1{font-size:30px;line-height:1.2;margin:4px 0 8px;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.quote{margin-top:18px;background:rgba(255,255,255,.68);border-radius:18px;padding:11px 13px;
font-size:13px;color:#675d59}
.nav{display:flex;gap:8px;margin:18px 0}
.nav button{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;color:#665b57}
.section{margin-top:18px}
.day{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:17px;
margin-bottom:13px;box-shadow:0 7px 22px rgba(70,45,40,.035)}
.dayhead{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}
.dayname{font-weight:800;font-size:18px}.date{font-size:12px;color:var(--muted);margin-left:7px}
.badge{font-size:10px;letter-spacing:1px;color:#9c6576;background:var(--pink2);padding:6px 9px;border-radius:999px}
.task{display:grid;grid-template-columns:31px 1fr auto;gap:11px;align-items:start;
padding:14px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.check{width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid #d8c9c4;
display:grid;place-items:center;cursor:pointer;margin-top:2px}
.check.done{background:var(--green);border-color:var(--green);color:white}
.taskmain{min-width:0}.tasktitle{font-size:16px;font-weight:750;line-height:1.35}
.horizontal{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(72px,.65fr) minmax(0,1.15fr);gap:14px;align-items:start}
.col{min-width:0}
.label{display:block;font-size:10px;letter-spacing:1px;color:#aa9b96;margin-bottom:5px;font-weight:800}
.col .value,.col .tasktitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{grid-column:1/-1;font-size:12px;color:#9b8e89;line-height:1.45;margin-top:-2px}

.task.done .tasktitle{text-decoration:line-through;color:#aaa}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.chip{background:#f7f1ee;border-radius:9px;padding:5px 8px;font-size:11px;color:#796d68}
.note{font-size:12px;color:#9b8e89;margin-top:7px;line-height:1.45}
.delete{background:transparent;color:#b9aaa5;font-size:15px;padding:4px;cursor:pointer}
.add{width:100%;padding:16px;border-radius:18px;background:#e5b5c3;color:white;font-weight:750;
box-shadow:0 8px 18px rgba(180,110,130,.18);cursor:pointer}
.empty{text-align:center;color:#aaa;padding:18px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(45,35,32,.34);display:none;align-items:flex-end;
justify-content:center;padding:12px;z-index:5}
.modal.show{display:flex}.sheet{background:#fffdfb;width:min(680px,100%);border-radius:28px 28px 20px 20px;padding:21px;
max-height:92vh;overflow:auto}.sheet h2{margin:0 0 16px;font-size:21px}
label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px;font-weight:700}
input,textarea{width:100%;border:1px solid var(--line);background:#faf7f5;border-radius:14px;padding:12px;outline:none}
textarea{min-height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:15px}
.cancel{background:#f3eeeb;color:#675d59}.save{background:#dfa9b8;color:white;font-weight:700}
.reminder{background:#fff5d9;border:1px solid #f0dfac;border-radius:18px;padding:13px;margin-top:13px;
font-size:12px;line-height:1.55;color:#6d5c35}
@media(max-width:420px){.hero h1{font-size:27px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">MY WEEK · PERSONAL PLANNER</div><div class="today" id="topDate"></div></div>
  <section class="hero">
    <div style="font-size:11px;color:#a36d7c;font-weight:800;letter-spacing:2px">WEEKLY PLANNER</div>
    <h1>My Week</h1>
  </section>
  <div class="nav"><button onclick="shift(-1)">‹ Previous</button><button onclick="goToday()">Today</button><button onclick="shift(1)">Next ›</button></div>
  <div id="days"></div>
  <button class="add" onclick="openModal()">＋ Add Plan</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="sheet">
  <h2>Add a Plan</h2>
  <label>Plan</label><input id="title" placeholder="例如：和朋友吃早午餐">
  <div class="row">
   <div><label>Time</label><input id="time" type="time"></div>
   <div><label>Date</label><input id="date" type="date"></div>
  </div>
  <label>Location</label><input id="place" placeholder="例如：Auckland CBD / Ortolana">
  <label>Notes</label><textarea id="note" placeholder="例如：提前15分钟出门，别迟到！"></textarea>
  <div class="reminder">⏰ <b>关于闹铃：</b>网页可以清楚显示Time，但重要安排建议同时加入 iPhone「提醒事项」或「日历」，这样可以收到系统通知。</div>
  <div class="actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="save" onclick="saveTask()">Save</button></div>
 </div>
</div>

<script>
const KEY='cannot_pigeon_planner_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{}');
let weekOffset=0, editing=null;
const names=['周一','周二','周三','周四','周五','周六','周日'];
function iso(d){return d.toISOString().slice(0,10)}
function monday(d){let x=new Date(d);let n=x.getDay()||7;x.setDate(x.getDate()-n+1);x.setHours(0,0,0,0);return x}
function render(){
 const base=monday(new Date());base.setDate(base.getDate()+weekOffset*7);
 document.getElementById('topDate').textContent=new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
 let out='';
 for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()+i);let key=iso(d);let tasks=(data[key]||[]).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
 out+=`<section class="day"><div class="dayhead"><div><span class="dayname">${names[i]}</span><span class="date">${d.getMonth()+1}月${d.getDate()}日</span></div>${iso(new Date())===key?'<span class="badge">TODAY</span>':''}</div>`;
 if(!tasks.length) out+=`<div class="empty">Today还没有安排 ♡</div>`;
 tasks.forEach((t,idx)=>out+=taskHTML(t,key,idx));
 out+=`</section>`}
 document.getElementById('days').innerHTML=out;
}
function taskHTML(t,key,idx){return `<div class="task ${t.done?'done':''}">
 <button class="check ${t.done?'done':''}" onclick="toggle('${key}',${idx})">${t.done?'✓':''}</button>
 <div class="taskmain horizontal">
   <div class="col plan"><span class="label">Plan</span><div class="tasktitle">${esc(t.title)}</div></div>
   <div class="col time"><span class="label">Time</span><div class="value">${t.time||'—'}</div></div>
   <div class="col place"><span class="label">Location</span><div class="value">${t.place?esc(t.place):'—'}</div></div>
   ${t.note?`<div class="note">${esc(t.note)}</div>`:''}
 </div>
 <button class="delete" onclick="removeTask('${key}',${idx})">×</button></div>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function toggle(k,i){data[k][i].done=!data[k][i].done;save()}
function removeTask(k,i){if(confirm('删除这个安排吗？')){data[k].splice(i,1);save()}}
function shift(n){weekOffset+=n;render()}
function goToday(){weekOffset=0;render()}
function openModal(){editing=null;document.getElementById('modal').classList.add('show');document.getElementById('date').value=iso(new Date())}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveTask(){
 let title=document.getElementById('title').value.trim(),date=document.getElementById('date').value;
 if(!title||!date){alert('Please enter a plan and date.');return}
 (data[date] ||= []).push({title,time:document.getElementById('time').value,place:document.getElementById('place').value.trim(),note:document.getElementById('note').value.trim(),done:false});
 save();closeModal();document.getElementById('title').value='';document.getElementById('time').value='';document.getElementById('place').value='';document.getElementById('note').value='';
}
render();
</script>
</body>
</html>
